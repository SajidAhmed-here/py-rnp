name: Tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  repository_dispatch:
    types: ['rnp update']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Set up librnp matrix
        id: matrix
        # Read the event as data rather than interpolating a dispatch payload into shell code.
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as stream:
              event = json.load(stream)
          refs = ['v0.18.1', '']  # Minimum supported release and upstream default branch.
          if os.environ['GITHUB_EVENT_NAME'] == 'repository_dispatch':
              tag = event.get('client_payload', {}).get('tag')
              if not isinstance(tag, str) or not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
                  raise SystemExit('rnp update requires client_payload.tag in vX.Y.Z form')
              if tuple(map(int, tag[1:].split('.'))) < (0, 18, 1):
                  raise SystemExit('librnp versions older than 0.18.1 are unsupported')
              refs = [tag]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('matrix=' + json.dumps(refs) + '\n')
          PY

  build-and-test:
    needs: prepare
    name: ${{ matrix.os }} / Python ${{ matrix.python.ver }} / librnp ${{ matrix.rnp || 'HEAD' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python:
          - {ver: '3.10', env: py310}
          - {ver: '3.11', env: py311}
          - {ver: '3.12', env: py312}
          - {ver: '3.13', env: py313}
        rnp: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      POETRY_NO_INTERACTION: '1'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'

    steps:
      - name: Checkout py-rnp
        uses: actions/checkout@v4

      - name: Checkout librnp
        uses: actions/checkout@v4
        with:
          repository: rnpgp/rnp
          ref: ${{ matrix.rnp }}
          # Keep native sources separate from the rnp Python package.
          path: .ci/librnp
          submodules: recursive
          persist-credentials: false

      - name: Set native library search paths
        # tox.ini already forwards both loader paths to the test environment.
        run: |
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/librnp/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/librnp/lib" >> "$GITHUB_ENV"

      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake pkg-config libbotan-2-dev libjson-c-dev libbz2-dev zlib1g-dev
          echo 'CRYPTO_BACKEND=botan' >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config botan json-c bzip2 zlib
          echo 'CRYPTO_BACKEND=botan3' >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix):$(brew --prefix bzip2):$(brew --prefix zlib)" >> "$GITHUB_ENV"

      - name: Configure librnp
        run: |
          cmake -S .ci/librnp -B "$RUNNER_TEMP/librnp-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/librnp" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCRYPTO_BACKEND="$CRYPTO_BACKEND" \
            -DBUILD_TESTING=OFF \
            -DENABLE_DOC=OFF \
            -DBUILD_SHARED_LIBS=ON

      - name: Build and install librnp
        run: |
          cmake --build "$RUNNER_TEMP/librnp-build" --parallel 2
          cmake --install "$RUNNER_TEMP/librnp-build"

      - name: Install Poetry
        run: pipx install 'poetry==2.3.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.ver }}
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install Python dependencies
        run: |
          poetry env use "$(command -v python)"
          poetry check --lock
          poetry install --with dev

      - name: Check native library discovery and version
        run: |
          # macOS can strip DYLD_* when starting the system shell; set it again here.
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/librnp/lib"
          poetry run python - <<'PY'
          import rnp

          print(rnp.version_string_full())
          assert rnp.version() >= rnp.version_for(0, 18, 1), 'librnp >= 0.18.1 is required'
          PY

      - name: Run formatting, lint, and tests
        run: |
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/librnp/lib"
          poetry run tox -e ${{ matrix.python.env }}
